<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function () {
    var r = document.documentElement;
    try {
      var t = localStorage.getItem('todo-theme');
      if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t);
      r.setAttribute('data-gradient', localStorage.getItem('todo-gradient') === 'off' ? 'off' : 'on');
    } catch (e) { r.setAttribute('data-gradient', 'on'); }
  })();
</script>
<!-- Your Supabase keys live in config.js (upload it once; it never needs replacing) -->
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#eceeea; --panel:#f9faf8; --panel-2:#f1f3ef; --line:#dde1db; --line-strong:#c6ccc4; --rule:#e6e9e3;
  --ink:#1e282c; --muted:#5f6b70; --faint:#97a19f;
  --accent:#1f6f68; --accent-soft:#dcebe8; --accent-ink:#ffffff;
  --danger:#b8352d; --danger-soft:#f6e1de;
  --done:#9aa3a0; --red:#d32f2f;
  --cat-none:#c6ccc4; --cat-client:#2f62c9; --cat-internal:#7a4cc2; --cat-large:#b7791f;
  --radius-lg:11px; --radius:7px; --radius-sm:5px;
  --shadow:0 1px 0 rgba(30,40,44,.04), 0 2px 5px rgba(30,40,44,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121617; --panel:#191e20; --panel-2:#20272a; --line:#2b3336; --line-strong:#3c464a; --rule:#252c2f;
    --ink:#e4e9e7; --muted:#9aa6a8; --faint:#6a7679;
    --accent:#5fb8ae; --accent-soft:#1d3532; --accent-ink:#0d1a19;
    --danger:#ef7a70; --danger-soft:#3a2321;
    --done:#5f6a6c; --red:#ff6b62;
    --cat-none:#3c464a; --cat-client:#7aa2f2; --cat-internal:#b493ec; --cat-large:#e0a84f;
    --shadow:0 1px 0 rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#121617; --panel:#191e20; --panel-2:#20272a; --line:#2b3336; --line-strong:#3c464a; --rule:#252c2f;
    --ink:#e4e9e7; --muted:#9aa6a8; --faint:#6a7679;
    --accent:#5fb8ae; --accent-soft:#1d3532; --accent-ink:#0d1a19;
    --danger:#ef7a70; --danger-soft:#3a2321;
    --done:#5f6a6c; --red:#ff6b62;
    --cat-none:#3c464a; --cat-client:#7aa2f2; --cat-internal:#b493ec; --cat-large:#e0a84f;
    --shadow:0 1px 0 rgba(0,0,0,.35);
    color-scheme:dark;
}
/* Warm accent while the gradient is on */
:root[data-gradient="on"]{--accent:#c2541a;--accent-soft:#fbe4d2;--accent-ink:#ffffff;--title-warm:#de6a1f;--title-strong:#c2541a}
:root[data-gradient="on"][data-theme="dark"]{--accent:#ff9d55;--accent-soft:#3b2416;--accent-ink:#2a1206;--title-warm:#ffa45c;--title-strong:#ffbb80}
@media (prefers-color-scheme: dark){
  :root[data-gradient="on"]:not([data-theme="light"]){--accent:#ff9d55;--accent-soft:#3b2416;--accent-ink:#2a1206;--title-warm:#ffa45c;--title-strong:#ffbb80}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:12.6px/1.45 Manrope, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;min-width:1000px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:11.3px}
.spacer{flex:1}
svg.ic{width:13px;height:13px;display:block}

/* Buttons */
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--radius);padding:6px 11px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 8px;font-size:11.7px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.icon-btn{flex:none;width:25px;height:25px;border:0;background:transparent;border-radius:5px;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--panel-2);color:var(--ink)}

/* Fields (login) */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.field-label{font-size:10.8px;font-weight:700;color:var(--muted)}
.input{width:100%;border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--radius-sm);padding:6px 8px;min-width:0}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Rich text */
.rich{min-height:1.45em;max-height:220px;overflow-y:auto;overflow-wrap:anywhere;cursor:text;outline:none;padding:1px 0}
.rich:empty::before{content:attr(data-placeholder);color:var(--faint);pointer-events:none}
.rich-toolbar{display:none;flex-wrap:wrap;gap:3px;margin:2px 0 4px}
.rich-wrap:focus-within .rich-toolbar{display:flex}
.tb-btn{display:inline-flex;align-items:center;gap:4px;height:22px;min-width:24px;padding:0 6px;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;font-size:11.3px;cursor:pointer;justify-content:center}
.tb-btn:hover{border-color:var(--line-strong)}
.tb-sep{width:1px;background:var(--line);margin:3px 2px}
.swatch{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.sw-ink{background:var(--ink)}
.fmt{overflow-wrap:anywhere}
.fmt ul{margin:2px 0;padding-left:17px}
.fmt li{margin:1px 0}
.fmt span[style*="color: rgb(0, 0, 0)"], .fmt font[color="#000000"]{color:var(--ink)!important}
.fmt span[style*="color: rgb(211, 47, 47)"], .fmt font[color="#d32f2f"]{color:var(--red)!important}
.fmt span[style*="background-color: rgb(255, 235, 59)"]{color:#1e282c;border-radius:2px}

/* App frame */
.main{height:100vh;display:flex;flex-direction:column}
.topbar{position:relative;isolation:isolate;overflow:hidden;height:47px;flex:none;display:flex;align-items:center;gap:14px;padding:0 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.mesh{display:none;position:absolute;inset:0;z-index:-1;background:#ffa947;overflow:hidden}
.mesh .blob{position:absolute;top:-62px;height:172px;border-radius:50%;filter:blur(26px);animation:drift var(--d) ease-in-out infinite alternate}
.mesh .b1{left:-6%;width:30%;background:#ffc94d;--d:13s;--x1:45%;--y1:5%;--x2:18%;--y2:-6%}
.mesh .b2{left:17%;width:27%;background:#ff8a3d;--d:15.5s;--x1:-38%;--y1:-5%;--x2:-12%;--y2:7%}
.mesh .b3{left:34%;width:28%;background:#ffc94d;--d:17.5s;--x1:30%;--y1:6%;--x2:-22%;--y2:-5%}
.mesh .b4{left:52%;width:22%;background:#e8533a;--d:11.5s;--x1:-35%;--y1:5%;--x2:30%;--y2:-4%}
.mesh .b5{left:72%;width:32%;background:#ff8a3d;--d:14.5s;--x1:-40%;--y1:-6%;--x2:-10%;--y2:5%}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(var(--x1),var(--y1)) scale(1.12)}100%{transform:translate(var(--x2),var(--y2)) scale(.95)}}
@media (prefers-reduced-motion: reduce){.mesh .blob{animation:none}}
:root[data-gradient="on"] .mesh{display:block}
:root[data-gradient="on"] .topbar{border-bottom-color:transparent}
:root[data-gradient="on"] .topbar .brand{color:#6b2c0c;mix-blend-mode:multiply}
:root[data-gradient="on"] .topbar #user-email{color:#5c2b0d}
:root[data-gradient="on"] .topbar .btn.ghost,:root[data-gradient="on"] .topbar .tb-icon{color:#3d1a06;background:rgba(255,255,255,.26)}
:root[data-gradient="on"] .topbar .btn.ghost:hover,:root[data-gradient="on"] .topbar .tb-icon:hover{background:rgba(255,255,255,.42)}
:root[data-gradient="on"][data-theme="dark"] .mesh{filter:brightness(.84)}
@media (prefers-color-scheme: dark){:root[data-gradient="on"]:not([data-theme="light"]) .mesh{filter:brightness(.84)}}
.tb-icon{width:27px;height:27px}
.tb-icon svg.ic{width:15px;height:15px}
#gradient-btn[aria-pressed="false"]{opacity:.65}
:root[data-gradient="on"] .col-head h2{color:var(--title-warm)}
:root[data-gradient="on"] .tab{color:color-mix(in srgb, var(--title-warm) 72%, var(--muted))}
:root[data-gradient="on"] .tab.active{color:var(--title-strong)}
.brand{font-weight:800;font-size:15.3px;letter-spacing:-.01em}
.topbar-slot{flex:1;display:flex;align-items:center;gap:7px}
.topbar-user{display:flex;align-items:center;gap:7px}
.columns{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;padding:11px}
.col{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.col-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:7px;min-height:47px;padding:9px 14px;border-bottom:1px solid var(--line)}
.col-head h2{margin:0;font-size:13.5px;font-weight:800;letter-spacing:-.01em}
.col-scroll{flex:1;min-height:0;overflow-y:auto;padding:13px 16px}
.col-foot{flex:none;display:flex;align-items:center;gap:7px;padding:11px 14px;border-top:1px solid var(--line)}
.loading{color:var(--faint);padding:18px 0;text-align:center}

/* Paper task editor */
.paper .pe-title{display:block;width:100%;border:0;border-bottom:1px solid transparent;background:transparent;padding:1px 0 3px;font-size:16.2px;font-weight:800;letter-spacing:-.015em;outline:none}
.paper .pe-title:focus{border-bottom-color:var(--line)}
.paper .pe-title::placeholder{color:var(--faint)}
.paper .pe-title.invalid{border-bottom-color:var(--danger)}
.paper .pe-title.invalid::placeholder{color:var(--danger)}
.pe-sub{color:var(--muted);margin-top:2px}
.pe-meta{display:flex;align-items:center;gap:7px;margin:8px 0 6px}
.pe-cat{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:999px;background:var(--panel-2);padding:2px 22px 2px 9px;font-size:11.3px;font-weight:700;color:var(--cat-color);cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.pe-cat.cat-none{color:var(--muted)}
.pe-lines{border-top:1px solid var(--rule)}
.line{position:relative;display:flex;align-items:flex-start;gap:7px;padding:5px 0;border-bottom:1px solid var(--rule)}
.line.invalid{border-bottom-color:var(--danger)}
.line.invalid .line-text::placeholder{color:var(--danger)}
.line.dragging{opacity:.35}
.line-grip{position:absolute;left:-15px;top:7px;width:13px;height:16px;padding:0;border:0;background:transparent;color:var(--faint);cursor:grab;opacity:0;display:grid;place-items:center}
.line:hover .line-grip{opacity:1}
.line-grip:active{cursor:grabbing}
.line-bullet{flex:none;width:13px;height:13px;margin-top:3px;border:1.5px solid var(--line-strong);border-radius:50%}
.line .check{margin-top:1px}
.line-main{flex:1;min-width:0}
.line-row{display:flex;align-items:flex-start;gap:5px}
.line-text{flex:1;min-width:0;display:block;border:0;background:transparent;resize:none;overflow:hidden;padding:0;margin:0;line-height:1.45;height:1.45em;outline:none}
.line-text::placeholder{color:var(--faint)}
.line.done .line-text{text-decoration:line-through;color:var(--done)}
.line-tags{flex:none;display:flex;gap:4px;margin-top:1px}
.ltag{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:0 7px;font-size:10.8px;font-weight:700;line-height:16px;color:var(--muted);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ltag.over{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.ltag.today{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.line.done .ltag{opacity:.55}
.line-tools{flex:none;display:none;gap:1px}
.line:hover .line-tools,.line:focus-within .line-tools{display:flex}
.tool{width:20px;height:19px;border:0;background:transparent;border-radius:4px;color:var(--faint);display:grid;place-items:center;cursor:pointer;padding:0}
.tool:hover{background:var(--panel-2);color:var(--ink)}
.tool.has{color:var(--accent)}
.tool-remove:hover{color:var(--danger)}
.det{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0 1px}
.det-desc{display:block;font-size:11.7px;color:var(--muted)}
.det-input{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:2px 7px;font-size:11.7px;min-width:0}
.det-input:focus{outline:none;border-color:var(--accent)}
.det-chip{border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:1px 8px;font-size:11.3px;font-weight:700;color:var(--muted);cursor:pointer}
.det-chip:hover{color:var(--ink);border-color:var(--line-strong)}
.det-clear{border:0;background:transparent;color:var(--faint);font-size:11.3px;font-weight:600;cursor:pointer;padding:1px 4px}
.det-clear:hover{color:var(--danger)}
.det-link{flex-wrap:nowrap;color:var(--faint)}
.det-link .link-in{flex:1;border:0;background:transparent;padding:1px 0;color:var(--accent);font-size:11.7px}
.det-link .link-in::placeholder{color:var(--faint)}
.det-open{font-size:11.3px;font-weight:700;color:var(--accent);text-decoration:none}
.det-open:hover{text-decoration:underline}
.line-ghost{padding:6px 0 6px 20px;border-bottom:1px solid var(--rule);color:var(--faint);cursor:text}
.line-ghost:hover{color:var(--muted)}
.pe-hint{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:10.8px;color:var(--faint)}
.pe-hint kbd,.pe-hint code{font:inherit;font-weight:700;color:var(--muted)}

/* Checkbox */
.check{appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:none;margin:0;border:1.5px solid var(--line-strong);border-radius:5px;background:var(--panel);cursor:pointer;display:inline-grid;place-content:center}
.check:hover{border-color:var(--accent)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:8px;height:4.5px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:translate(0,-1px) rotate(-45deg)}

/* Week */
.overdue-strip{flex:none;display:flex;align-items:center;justify-content:space-between;gap:7px;width:100%;padding:8px 14px;border:0;border-bottom:1px solid var(--line);background:var(--danger-soft);color:var(--danger);font-weight:700;text-align:left;cursor:pointer}
.overdue-strip:hover{filter:brightness(.98)}
.overdue-strip.none{background:var(--panel);color:var(--faint);font-weight:600;cursor:default}
.strip-go{font-size:11.3px;text-decoration:underline;text-underline-offset:2px}
.day + .day{margin-top:18px}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:7px;padding-bottom:5px;margin-bottom:7px;border-bottom:2px solid var(--line)}
.day-name{font-size:18.9px;font-weight:800;letter-spacing:-.025em;display:flex;align-items:center;gap:7px}
.day-date{color:var(--muted);font-weight:600;font-size:11.7px}
.day.today .day-head{border-bottom-color:var(--accent)}
.day.today .day-name{color:var(--accent)}
.day-badge{font-size:10px;font-weight:700;letter-spacing:0;padding:2px 7px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.day.today .day-badge{background:var(--accent-soft);color:var(--accent)}
.day-body{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.day-empty{grid-column:1/-1;padding:11px;color:var(--faint);font-size:11.7px;border:1px dashed var(--line);border-radius:var(--radius);text-align:center}
.wk-card{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;width:100%;padding:7px 9px;text-align:left;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cat-color);border-radius:var(--radius);box-shadow:var(--shadow)}
.wk-card:hover{border-color:var(--line-strong);border-left-color:var(--cat-color)}
.wk-card.selected{outline:2px solid var(--accent);outline-offset:1px}
.wk-card.all-done{opacity:.6}
.wk-title{font-weight:700;font-size:12.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-item{position:relative;padding-left:10px;font-size:11.3px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.wk-item::before{content:"";position:absolute;left:1px;top:.6em;width:4px;height:4px;border-radius:50%;background:currentColor}
.wk-item.done{text-decoration:line-through;color:var(--done)}
.wk-more{font-size:10.8px;font-weight:700;color:var(--accent)}

/* Right column */
.tabs{display:flex;gap:3px;padding:3px;background:var(--panel-2);border-radius:var(--radius)}
.tab{display:flex;align-items:center;gap:5px;border:0;background:transparent;padding:4px 9px;border-radius:5px;font-weight:700;color:var(--muted);cursor:pointer}
.tab.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.tab-count{font-size:10.4px;min-width:18px;padding:0 5px;border-radius:999px;background:var(--line);color:var(--muted);text-align:center}
.tab[data-tab=overdue] .tab-count.has{background:var(--danger);color:#fff}
.filters{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:9px 14px;border-bottom:1px solid var(--line)}
.chip-toggle{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--faint);font-size:11.3px;font-weight:600;cursor:pointer}
.chip-toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--cat-color);opacity:.45}
.chip-toggle.on{background:var(--panel-2);color:var(--ink);border-color:var(--line-strong)}
.chip-toggle.on .dot{opacity:1}
.cat-none{--cat-color:var(--cat-none)} .cat-client{--cat-color:var(--cat-client)} .cat-internal{--cat-color:var(--cat-internal)} .cat-large{--cat-color:var(--cat-large)}

.task-card{display:block;margin-bottom:9px;padding:11px 11px 9px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cat-color);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer}
.task-card:hover{border-color:var(--line-strong);border-left-color:var(--cat-color)}
.task-card.selected{outline:2px solid var(--accent);outline-offset:1px}
.task-card.expanded{cursor:default;padding:10px 12px 9px 22px}
.task-card.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 6px var(--accent-soft)}100%{box-shadow:var(--shadow)}}
@media (prefers-reduced-motion: reduce){.task-card.flash{animation:none}}
.tc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}
.tc-head-text{min-width:0}
.tc-title{font-weight:800;font-size:13.5px;letter-spacing:-.01em;overflow-wrap:anywhere}
.tc-sub{color:var(--muted);font-size:11.7px;margin-top:2px}
.tc-meta{flex:none;display:flex;align-items:center;gap:7px}
.tc-progress{font-size:10.8px;font-weight:700;color:var(--faint)}
.cat-tag{font-size:10.4px;font-weight:700;color:var(--cat-color);background:color-mix(in srgb, var(--cat-color) 15%, transparent);padding:2px 7px;border-radius:999px;white-space:nowrap}
.tc-items{list-style:none;margin:9px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tc-item{display:flex;align-items:flex-start;gap:7px;font-size:12.2px}
.tc-item .check{margin-top:1px}
.tc-item-title{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.tc-item.done .tc-item-title{text-decoration:line-through;color:var(--done)}
.tc-item.done .pill,.tc-item.done .tc-link{opacity:.55}
.pill{flex:none;font-size:10.4px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;max-width:117px;overflow:hidden;text-overflow:ellipsis}
.pill.due-over{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.pill.due-today{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tc-link{flex:none;font-size:10.8px;font-weight:700;color:var(--accent);text-decoration:none}
.tc-link:hover{text-decoration:underline}
.tc-collapsed{display:flex;align-items:center;gap:7px;font-size:11.3px;font-weight:700;color:var(--faint)}
.tc-collapsed .ic{width:16px;height:12px}
.tc-divider{border-top:1px dashed var(--line-strong);margin:1px 0}
.tc-edit-head{display:flex;align-items:center;justify-content:space-between;margin:-3px -4px 6px 0}
.tc-edit-foot{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.list-empty{padding:25px 11px;text-align:center;color:var(--faint);border:1px dashed var(--line);border-radius:var(--radius)}

/* Auth / config */
.center-screen{min-height:100vh;display:grid;place-items:center;padding:22px}
.auth-card{width:342px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:23px;box-shadow:var(--shadow)}
.auth-card h1{margin:0 0 4px;font-size:19.8px;font-weight:800;letter-spacing:-.02em}
.auth-card p{margin:0 0 16px}
.form-error{color:var(--danger);font-weight:600;margin:0 0 11px!important}
.auth-card code{background:var(--panel-2);padding:1px 5px;border-radius:4px;font-size:11.3px}

/* Toast */
.toast{position:fixed;left:50%;bottom:22px;z-index:50;transform:translate(-50%,14px);padding:8px 13px;border-radius:7px;background:var(--ink);color:var(--panel);font-weight:700;opacity:0;pointer-events:none;transition:opacity .18s, transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.error{background:var(--danger);color:#fff}
</style>
</head>
<body>

<!-- Shown if config.js is missing or still has placeholder values -->
<div id="config-screen" class="center-screen" hidden>
  <div class="auth-card">
    <h1>Almost there</h1>
    <p class="muted" id="config-msg">Add a <code>config.js</code> file next to <code>index.html</code> in your GitHub repository, with your Supabase project URL and publishable key in it.</p>
  </div>
</div>

<div id="login-screen" class="center-screen" hidden>
  <form class="auth-card" id="login-form">
    <h1>Todo List</h1>
    <p class="muted">Sign in to see your tasks.</p>
    <label class="field"><span class="field-label">Email</span><input class="input" type="email" id="login-email" autocomplete="username" required></label>
    <label class="field"><span class="field-label">Password</span><input class="input" type="password" id="login-password" autocomplete="current-password" required></label>
    <p class="form-error" id="login-error" hidden></p>
    <button class="btn primary block" type="submit" id="login-btn">Sign in</button>
  </form>
</div>

<div id="main" class="main" hidden>
  <header class="topbar">
    <div class="mesh" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span><span class="blob b5"></span></div>
    <div class="brand">Todo List</div>
    <!-- Space reserved for future buttons -->
    <div class="topbar-slot" id="topbar-slot"></div>
    <div class="topbar-user">
      <button class="icon-btn tb-icon" id="gradient-btn" type="button" aria-pressed="true" aria-label="Gradient" title="Turn gradient off"></button>
      <button class="icon-btn tb-icon" id="theme-btn" type="button" aria-label="Switch colour mode" title="Switch to dark mode"></button>
      <span class="muted small" id="user-email"></span>
      <button class="btn ghost small" id="signout-btn" type="button">Sign out</button>
    </div>
  </header>

  <div class="columns">
    <!-- Left: new task -->
    <section class="col" aria-label="New task">
      <div class="col-head"><h2>New task</h2><span class="muted small" id="draft-status"></span></div>
      <div class="col-scroll" id="new-form"></div>
      <div class="col-foot">
        <button class="btn ghost" id="clear-draft" type="button">Clear</button>
        <span class="spacer"></span>
        <button class="btn primary" id="add-task-btn" type="button">Add task to board</button>
      </div>
    </section>

    <!-- Middle: next 7 days -->
    <section class="col" aria-label="Next 7 days">
      <div class="col-head"><h2>Next 7 days</h2></div>
      <button class="overdue-strip none" id="overdue-strip" type="button" disabled></button>
      <div class="col-scroll" id="week-days"></div>
    </section>

    <!-- Right: all tasks -->
    <section class="col" aria-label="All tasks">
      <div class="col-head">
        <div class="tabs" role="tablist" id="tabs">
          <button class="tab active" data-tab="current" role="tab" type="button">Current <span class="tab-count">0</span></button>
          <button class="tab" data-tab="overdue" role="tab" type="button">Overdue <span class="tab-count">0</span></button>
          <button class="tab" data-tab="completed" role="tab" type="button">Completed <span class="tab-count">0</span></button>
        </div>
      </div>
      <div class="filters" id="filters"></div>
      <div class="col-scroll" id="task-list"></div>
    </section>
  </div>
</div>

<datalist id="assignee-list"></datalist>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Supabase details come from config.js (see README) */
const CONFIG = window.TODO_CONFIG || {};
const SUPABASE_URL = String(CONFIG.SUPABASE_URL || '');
const SUPABASE_KEY = String(CONFIG.SUPABASE_KEY || '');

/* ============================================================ */
const CATEGORIES = [
  { id: 'None', cls: 'cat-none' },
  { id: 'Client-Request', cls: 'cat-client' },
  { id: 'Internal-Request', cls: 'cat-internal' },
  { id: 'Large Project', cls: 'cat-large' },
];
const TAB_LABEL = { current: 'Current', overdue: 'Overdue', completed: 'Completed' };
const PREVIEW_CHARS = 60;
const WD_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WD_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const state = {
  user: null, started: false, tasks: [],
  tab: 'current', filter: new Set(CATEGORIES.map(c => c.id)),
  selectedId: null, editor: null,
  today: null, draftEditor: null, draftTimer: null, draftChain: Promise.resolve(),
};
let sb = null;

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const catCls = id => (CATEGORIES.find(c => c.id === id) || CATEGORIES[0]).cls;
const truncate = (s, n) => (s.length > n ? s.slice(0, n).trimEnd() + '…' : s);
const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const findTask = id => state.tasks.find(t => t.id === id);
const textOf = html => { const d = document.createElement('div'); d.innerHTML = html || ''; return d.textContent.trim(); };

const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const todayStr = () => ymd(new Date());
function ordinal(n) { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function formatDue(s) {
  const t = parseYmd(state.today);
  if (s === state.today) return 'Today';
  if (s === ymd(addDays(t, 1))) return 'Tomorrow';
  if (s === ymd(addDays(t, -1))) return 'Yesterday';
  const d = parseYmd(s);
  return `${WD_SHORT[d.getDay()]} ${d.getDate()} ${MON_SHORT[d.getMonth()]}` + (d.getFullYear() !== t.getFullYear() ? ` ${d.getFullYear()}` : '');
}
function normLink(raw) {
  const s = (raw || '').trim();
  if (!s) return null;
  if (/^(https?:|mailto:)/i.test(s)) return s;
  return 'https://' + s.replace(/^[a-z][a-z0-9+.-]*:\/*/i, '');
}
const safeHref = l => (l && /^(https?:|mailto:)/i.test(l) ? l : null);

let toastTimer;
function toast(msg, isError = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.toggle('error', isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 4500 : 2600);
}

/* ---------- Task status ---------- */
const itemOverdue = it => !it.done && !!it.due && it.due < state.today;
function taskStatus(t) {
  const items = t.items || [];
  if (items.length && items.every(i => i.done)) return 'completed';
  if (items.some(itemOverdue)) return 'overdue';
  return 'current';
}
function nextDue(t) { return (t.items || []).filter(i => !i.done && i.due).map(i => i.due).sort()[0] || null; }

/* ---------- Rich text: sanitising ---------- */
function parseColor(str) {
  if (!str) return null;
  str = String(str).trim().toLowerCase();
  let m = str.match(/^rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)(?:[,\s/]+([\d.]+))?\s*\)$/);
  if (m) return { r: +m[1], g: +m[2], b: +m[3], a: m[4] === undefined ? 1 : +m[4] };
  m = str.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/);
  if (m) { let h = m[1]; if (h.length === 3) h = [...h].map(c => c + c).join(''); return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16), a: 1 }; }
  if (str === 'red') return { r: 255, g: 0, b: 0, a: 1 };
  if (str === 'yellow') return { r: 255, g: 255, b: 0, a: 1 };
  return null;
}
const isRed = c => { c = parseColor(c); return !!c && c.a > 0 && c.r >= 150 && c.g < 120 && c.b < 120; };
const isYellow = c => { c = parseColor(c); return !!c && c.a > 0 && c.r >= 200 && c.g >= 180 && c.b < 170; };
const RED_SPAN = '<span style="color: rgb(211, 47, 47);">';
const HL_SPAN = '<span style="background-color: rgb(255, 235, 59);">';

// Keeps only bold / italic / underline / red text / yellow highlight / line breaks.
function sanitizeHTML(html) {
  if (!html) return '';
  const doc = new DOMParser().parseFromString(`<body>${html}</body>`, 'text/html');
  return serialise(doc.body, false).replace(/^(<br>)+|(<br>)+$/g, '');
}
function serialise(node, inItem) {
  let s = '';
  node.childNodes.forEach(ch => {
    if (ch.nodeType === 3) { s += esc(ch.nodeValue); return; }
    if (ch.nodeType !== 1) return;
    const tag = ch.tagName;
    if (tag === 'BR') { s += '<br>'; return; }
    if (tag === 'UL' || tag === 'OL') {
      const lis = [...ch.children].map(li => serialise(li, true).replace(/^(<br>)+|(<br>)+$/g, '')).filter(Boolean);
      if (inItem) { s += (s ? '<br>' : '') + lis.join('<br>'); return; }   // one level only
      if (!lis.length) return;
      s = s.replace(/(<br>)+$/, '');
      s += '<ul>' + lis.map(x => `<li>${x}</li>`).join('') + '</ul>';
      return;
    }
    if (['SCRIPT','STYLE','IFRAME','OBJECT','IMG','SVG','TEMPLATE'].includes(tag)) return;
    let inner = serialise(ch, inItem);
    const st = ch.style || {};
    const fw = st.fontWeight, deco = (st.textDecoration || '') + ' ' + (st.textDecorationLine || '');
    const color = st.color || (tag === 'FONT' ? ch.getAttribute('color') : '');
    const bg = st.backgroundColor;
    if (inner) {
      if (tag === 'B' || tag === 'STRONG' || fw === 'bold' || +fw >= 600) inner = `<b>${inner}</b>`;
      if (tag === 'I' || tag === 'EM' || st.fontStyle === 'italic') inner = `<i>${inner}</i>`;
      if (tag === 'U' || deco.includes('underline')) inner = `<u>${inner}</u>`;
      if (isRed(color)) inner = `${RED_SPAN}${inner}</span>`;
      if (tag === 'MARK' || isYellow(bg)) inner = `${HL_SPAN}${inner}</span>`;
    }
    if (['DIV','P','LI','H1','H2','H3','H4','H5','H6','BLOCKQUOTE'].includes(tag)) {
      if (inner.startsWith('<ul>')) s = s.replace(/(<br>)+$/, '');
      else if (s && !s.endsWith('<br>') && !s.endsWith('</ul>')) s += '<br>';
    }
    s += inner;
  });
  return s;
}

/* ---------- Rich text: editor ---------- */
const TOOLBAR = [
  { cmd: 'bold', html: '<b>B</b>', title: 'Bold' },
  { cmd: 'italic', html: '<i>I</i>', title: 'Italic' },
  { cmd: 'underline', html: '<u>U</u>', title: 'Underline' },
  { cmd: 'list', html: '&bull; List', title: 'Dotpoints (or type - and a space)' },
  { sep: true },
  { cmd: 'hl', html: '<span class="swatch" style="background:#ffeb3b"></span>Highlight', title: 'Highlight (click again to remove)' },
  { cmd: 'red', html: '<span class="swatch" style="background:#d32f2f"></span>Red', title: 'Red text' },
  { cmd: 'black', html: '<span class="swatch sw-ink"></span>Black', title: 'Black text' },
  { sep: true },
  { cmd: 'clear', html: 'Clear', title: 'Clear formatting' },
];
function buildRich(html, placeholder) {
  const wrap = document.createElement('div');
  wrap.className = 'rich-wrap';
  const tb = document.createElement('div');
  tb.className = 'rich-toolbar';
  const ed = document.createElement('div');
  ed.className = 'rich fmt';
  ed.contentEditable = 'true';
  ed.setAttribute('role', 'textbox');
  ed.setAttribute('aria-multiline', 'true');
  ed.setAttribute('aria-label', placeholder || 'Text');
  ed.dataset.placeholder = placeholder || '';
  ed.innerHTML = sanitizeHTML(html || '');
  TOOLBAR.forEach(b => {
    if (b.sep) { const s = document.createElement('span'); s.className = 'tb-sep'; tb.appendChild(s); return; }
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'tb-btn'; btn.innerHTML = b.html; btn.title = b.title;
    btn.addEventListener('mousedown', e => e.preventDefault()); // keep the text selection
    btn.addEventListener('click', () => applyFmt(b.cmd, ed));
    tb.appendChild(btn);
  });
  ed.addEventListener('paste', e => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  ed.addEventListener('input', e => {
    if (!ed.textContent.trim() && !ed.querySelector('li') && ed.innerHTML !== '') { ed.innerHTML = ''; return; }
    // "- " or "* " at the start of a line becomes a dotpoint
    if (e.inputType !== 'insertText' || e.data !== ' ') return;
    const sel = window.getSelection(), n = sel.anchorNode;
    if (!n || n.nodeType !== 3 || !ed.contains(n) || n.parentElement.closest('li')) return;
    if (!/^[-*]\s$/.test(n.nodeValue.slice(0, sel.anchorOffset).replace(/\u00a0/g, ' '))) return;
    if (n.previousSibling && n.previousSibling.nodeName !== 'BR') return;
    document.execCommand('insertUnorderedList');
    const s2 = window.getSelection(), t = s2.anchorNode;
    if (t && t.nodeType === 3 && /^[-*][\s\u00a0]/.test(t.nodeValue)) {
      t.deleteData(0, 2);
      const r = document.createRange(); r.setStart(t, 0); r.collapse(true);
      s2.removeAllRanges(); s2.addRange(r);
    }
  });
  wrap.append(tb, ed);
  return { el: wrap, editor: ed, getHTML: () => sanitizeHTML(ed.innerHTML) };
}
function applyFmt(cmd, ed) {
  const sel = window.getSelection();
  if (!sel.rangeCount || !ed.contains(sel.anchorNode)) { ed.focus(); return; }
  const exec = (c, v = null, css = false) => { document.execCommand('styleWithCSS', false, css); return document.execCommand(c, false, v); };
  switch (cmd) {
    case 'bold': case 'italic': case 'underline': exec(cmd); break;
    case 'list': exec('insertUnorderedList'); break;
    case 'hl': {
      const on = isYellow(document.queryCommandValue('backColor')) || isYellow(document.queryCommandValue('hiliteColor'));
      const val = on ? 'transparent' : '#ffeb3b';
      if (!exec('hiliteColor', val, true)) exec('backColor', val, true);
      break;
    }
    case 'red': exec('foreColor', '#d32f2f', true); break;
    case 'black': exec('foreColor', '#000000', true); break;
    case 'clear': exec('removeFormat'); exec('hiliteColor', 'transparent', true); break;
  }
  ed.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ---------- Task editor: "paper" style, used for the new-task form and for editing ---------- */
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const MOD = IS_MAC ? '⌘' : 'Ctrl';
const ALT = IS_MAC ? 'Option' : 'Alt';
const svg = (d, fill) => `<svg class="ic" viewBox="0 0 16 16" fill="${fill ? 'currentColor' : 'none'}" stroke="${fill ? 'none' : 'currentColor'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONS = {
  person: svg('<circle cx="8" cy="5.4" r="2.6"/><path d="M3 13.6c.8-2.4 2.7-3.6 5-3.6s4.2 1.2 5 3.6"/>'),
  calendar: svg('<rect x="2.5" y="3.5" width="11" height="10" rx="1.6"/><path d="M2.5 6.8h11M5.5 2v3M10.5 2v3"/>'),
  text: svg('<path d="M3 4.5h10M3 8h10M3 11.5h6"/>'),
  link: svg('<path d="M6.6 9.4l2.8-2.8"/><path d="M7.4 4.6l.9-.9a2.6 2.6 0 013.7 3.7l-.9.9"/><path d="M8.6 11.4l-.9.9A2.6 2.6 0 014 8.6l.9-.9"/>'),
  x: svg('<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>'),
  grip: svg('<circle cx="6" cy="3.5" r="1.2"/><circle cx="10" cy="3.5" r="1.2"/><circle cx="6" cy="8" r="1.2"/><circle cx="10" cy="8" r="1.2"/><circle cx="6" cy="12.5" r="1.2"/><circle cx="10" cy="12.5" r="1.2"/>', true),
  done: svg('<path d="M2 8.5l2.5 2.5L9.5 5"/><path d="M7.5 10.5l.5.5L14 5"/>'),
  sparkle: svg('<path d="M7 2.5l1.3 3.2 3.2 1.3-3.2 1.3L7 11.5 5.7 8.3 2.5 7l3.2-1.3z"/><path d="M12 10.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/>'),
  sun: svg('<circle cx="8" cy="8" r="2.8"/><path d="M8 1.8v1.4M8 12.8v1.4M1.8 8h1.4M12.8 8h1.4M3.6 3.6l1 1M11.4 11.4l1 1M3.6 12.4l1-1M11.4 4.6l1-1"/>'),
  moon: svg('<path d="M13.2 9.6A5.4 5.4 0 016.4 2.8a5.4 5.4 0 106.8 6.8z"/>'),
};

// Typing shortcuts: "@James" sets the assignee, "!fri" / "!tomorrow" / "!23/10" / "!+3" sets the date.
function parseDateToken(tok) {
  tok = tok.toLowerCase();
  const base = parseYmd(state.today);
  if (['today', 'tod', 'tdy'].includes(tok)) return state.today;
  if (['tomorrow', 'tom', 'tmr', 'tmrw'].includes(tok)) return ymd(addDays(base, 1));
  if (tok.length >= 3) {
    const i = WD_LONG.findIndex(w => w.toLowerCase().startsWith(tok));
    if (i > -1) return ymd(addDays(base, (i - base.getDay() + 7) % 7));
  }
  let m = tok.match(/^\+(\d{1,3})d?$/);
  if (m) return ymd(addDays(base, +m[1]));
  m = tok.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2}|\d{4}))?$/);
  if (m) {
    const d = +m[1], mo = +m[2];
    const y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : base.getFullYear();
    let dt = new Date(y, mo - 1, d);
    if (dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
    if (!m[3] && dt < base) dt = new Date(y + 1, mo - 1, d);
    return ymd(dt);
  }
  return null;
}
function matchKnownName(name) {
  if (name.toLowerCase() === 'me') return 'Me';
  const known = [...document.querySelectorAll('#assignee-list option')].map(o => o.value);
  return known.find(k => k.toLowerCase() === name.toLowerCase()) || name.charAt(0).toUpperCase() + name.slice(1);
}
function parseShortcuts(text) {
  let assignee = null, due = null, hit = false;
  let out = text.replace(/(^|\s)@([A-Za-z][\w.'-]*)/g, (all, pre, name) => { assignee = matchKnownName(name); hit = true; return pre; });
  out = out.replace(/(^|\s)!([\w/+-]+)/g, (all, pre, tok) => { const d = parseDateToken(tok); if (!d) return all; due = d; hit = true; return pre; });
  if (hit) out = out.replace(/[ \t]{2,}/g, ' ').replace(/[ \t]+$/gm, '').replace(/^[ \t]+/gm, '').trim();
  return { hit, text: out, assignee, due };
}
function nextMonday() { const b = parseYmd(state.today); return ymd(addDays(b, ((1 - b.getDay() + 7) % 7) || 7)); }

function buildLine(it, mode, ctx) {
  const s = { id: it.id || uid(), assignee: it.assignee || null, due: it.due || null, done: !!it.done };
  const el = document.createElement('div');
  el.className = 'line' + (s.done ? ' done' : '');
  el.innerHTML = `
    <button type="button" class="line-grip" tabindex="-1" title="Drag to reorder" aria-label="Drag to reorder">${ICONS.grip}</button>
    ${mode === 'edit' ? '<input type="checkbox" class="check line-check" aria-label="Done">' : '<span class="line-bullet" aria-hidden="true"></span>'}
    <div class="line-main">
      <div class="line-row">
        <textarea class="line-text" rows="1" maxlength="500" placeholder="Add an item" aria-label="Checklist item"></textarea>
        <span class="line-tags"></span>
        <span class="line-tools">
          <button type="button" class="tool" data-tool="assignee" title="Assignee">${ICONS.person}</button>
          <button type="button" class="tool" data-tool="due" title="Due date">${ICONS.calendar}</button>
          <button type="button" class="tool" data-tool="desc" title="Description">${ICONS.text}</button>
          <button type="button" class="tool" data-tool="link" title="Link">${ICONS.link}</button>
          <button type="button" class="tool tool-remove" data-tool="remove" title="Remove item">${ICONS.x}</button>
        </span>
      </div>
      <div class="det det-assignee" hidden>
        <button type="button" class="det-chip" data-assign="me">Me</button>
        <input class="det-input as-name" list="assignee-list" placeholder="Someone else" maxlength="80" aria-label="Assignee name">
        <button type="button" class="det-clear" data-clear="assignee">Clear</button>
      </div>
      <div class="det det-due" hidden>
        <input type="date" class="det-input due-in" aria-label="Due date">
        <button type="button" class="det-chip" data-quick="today">Today</button>
        <button type="button" class="det-chip" data-quick="tomorrow">Tomorrow</button>
        <button type="button" class="det-chip" data-quick="monday">Next Monday</button>
        <button type="button" class="det-clear" data-clear="due">Clear</button>
      </div>
      <div class="det det-desc" hidden></div>
      <div class="det det-link" hidden>${ICONS.link}<input class="link-in" type="url" placeholder="Paste a link" maxlength="2000" aria-label="Link"><a class="det-open" target="_blank" rel="noopener noreferrer" hidden>Open</a></div>
    </div>`;
  const ta = el.querySelector('.line-text');
  const tags = el.querySelector('.line-tags');
  const P = { assignee: el.querySelector('.det-assignee'), due: el.querySelector('.det-due'), desc: el.querySelector('.det-desc'), link: el.querySelector('.det-link') };
  const nameIn = el.querySelector('.as-name'), dueIn = el.querySelector('.due-in');
  const linkIn = el.querySelector('.link-in'), openA = el.querySelector('.det-open');
  const check = el.querySelector('.line-check');
  const desc = buildRich(it.description, 'Add a description');
  P.desc.appendChild(desc.el);

  ta.value = it.title || '';
  linkIn.value = it.link || '';
  const descHasText = () => !!textOf(desc.getHTML());
  P.desc.hidden = !descHasText();
  P.link.hidden = !linkIn.value.trim();
  if (check) check.checked = s.done;

  const fit = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
  const focusEnd = () => { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); };
  const updateOpen = () => { const h = safeHref(normLink(linkIn.value)); openA.hidden = !h; if (h) openA.href = h; };
  updateOpen();
  const renderTags = () => {
    let h = '';
    if (s.assignee) h += `<button type="button" class="ltag" data-tool="assignee" title="Change assignee">${esc(s.assignee)}</button>`;
    if (s.due) {
      const cls = !s.done && s.due < state.today ? 'over' : (s.due === state.today && !s.done ? 'today' : '');
      h += `<button type="button" class="ltag ${cls}" data-tool="due" title="Change due date">${esc(formatDue(s.due))}</button>`;
    }
    tags.innerHTML = h;
    el.querySelector('.tool[data-tool=assignee]').classList.toggle('has', !!s.assignee);
    el.querySelector('.tool[data-tool=due]').classList.toggle('has', !!s.due);
    el.querySelector('.tool[data-tool=desc]').classList.toggle('has', descHasText());
    el.querySelector('.tool[data-tool=link]').classList.toggle('has', !!linkIn.value.trim());
  };
  renderTags();

  const close = (name, refocus) => { P[name].hidden = true; if (refocus) focusEnd(); };
  const toggle = name => {
    if (name === 'assignee' || name === 'due') {
      const opening = P[name].hidden;
      close('assignee'); close('due');
      if (!opening) { focusEnd(); return; }
      P[name].hidden = false;
      if (name === 'assignee') { nameIn.value = s.assignee && s.assignee !== 'Me' ? s.assignee : ''; nameIn.focus(); }
      else { dueIn.value = s.due || ''; dueIn.focus(); }
    } else if (name === 'desc') {
      if (P.desc.hidden) { P.desc.hidden = false; desc.editor.focus(); }
      else if (!descHasText()) { P.desc.hidden = true; focusEnd(); }
      else desc.editor.focus();
    } else if (name === 'link') {
      if (P.link.hidden) { P.link.hidden = false; linkIn.focus(); }
      else if (!linkIn.value.trim()) { P.link.hidden = true; focusEnd(); }
      else linkIn.focus();
    } else if (name === 'remove') {
      ctx.remove(api, false);
    }
  };
  const setAssignee = v => { s.assignee = v; renderTags(); ctx.changed(); };
  const setDue = v => { s.due = v; renderTags(); ctx.changed(); };
  const applyShortcuts = () => {
    const r = parseShortcuts(ta.value);
    if (!r.hit) return;
    ta.value = r.text;
    if (r.assignee) s.assignee = r.assignee;
    if (r.due) s.due = r.due;
    renderTags(); fit(); ctx.changed();
  };
  const hasDetails = () => !!(s.assignee || s.due || descHasText() || linkIn.value.trim());

  el.addEventListener('click', e => {
    const t = e.target.closest('[data-tool]');
    if (t) { toggle(t.dataset.tool); return; }
    const a = e.target.closest('[data-assign]');
    if (a) { setAssignee('Me'); close('assignee', true); return; }
    const q = e.target.closest('[data-quick]');
    if (q) { setDue(q.dataset.quick === 'today' ? state.today : q.dataset.quick === 'tomorrow' ? ymd(addDays(parseYmd(state.today), 1)) : nextMonday()); close('due', true); return; }
    const c = e.target.closest('[data-clear]');
    if (c) { if (c.dataset.clear === 'assignee') { nameIn.value = ''; setAssignee(null); } else { dueIn.value = ''; setDue(null); } close(c.dataset.clear, true); }
  });
  nameIn.addEventListener('change', () => { const v = nameIn.value.trim(); if (v) setAssignee(matchKnownName(v)); });
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); const v = nameIn.value.trim(); if (v) setAssignee(matchKnownName(v)); close('assignee', true); } });
  dueIn.addEventListener('change', () => setDue(dueIn.value || null));
  dueIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); close('due', true); } });
  linkIn.addEventListener('input', () => { updateOpen(); renderTags(); });
  linkIn.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); focusEnd(); } });
  desc.editor.addEventListener('input', () => renderTags());
  if (check) check.addEventListener('change', () => { s.done = check.checked; el.classList.toggle('done', s.done); renderTags(); ctx.changed(); });

  ta.addEventListener('input', () => { fit(); ctx.updateGhost(); });
  ta.addEventListener('keydown', e => {
    if (e.isComposing) return;
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { applyShortcuts(); return; } // bubbles up to submit
    if (e.key === 'Enter' && (e.altKey || e.shiftKey)) {
      e.preventDefault();
      ta.setRangeText('\n', ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); applyShortcuts(); ctx.newAfter(api); return; }
    if (e.key === 'Backspace' && !ta.value && ta.selectionStart === 0 && !hasDetails()) { e.preventDefault(); ctx.remove(api, true); return; }
    if (e.key === 'ArrowUp' && !e.shiftKey && !ta.value.slice(0, ta.selectionStart).includes('\n')) { e.preventDefault(); ctx.nav(api, -1); return; }
    if (e.key === 'ArrowDown' && !e.shiftKey && !ta.value.slice(ta.selectionEnd).includes('\n')) { e.preventDefault(); ctx.nav(api, 1); }
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Escape' && (!P.assignee.hidden || !P.due.hidden)) { e.stopPropagation(); close('assignee'); close('due'); focusEnd(); }
  });
  el.addEventListener('focusout', e => {
    if (el.contains(e.relatedTarget)) return;
    close('assignee'); close('due');
    applyShortcuts();
    if (!descHasText()) P.desc.hidden = true;
    if (!linkIn.value.trim()) P.link.hidden = true;
    ctx.updateGhost();
  });

  // Drag to reorder (only from the grip, so text selection still works)
  const grip = el.querySelector('.line-grip');
  grip.addEventListener('mousedown', () => { el.draggable = true; });
  document.addEventListener('mouseup', () => { el.draggable = false; });
  el.addEventListener('dragstart', e => { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); ctx.dragging = el; requestAnimationFrame(() => el.classList.add('dragging')); });
  el.addEventListener('dragend', () => { el.draggable = false; el.classList.remove('dragging'); ctx.dragging = null; ctx.changed(); });

  const api = {
    el, ta, fit, focusEnd, applyShortcuts, hasDetails,
    isBlank: () => !ta.value.trim() && !hasDetails(),
    getData: () => ({ id: s.id, title: ta.value, description: desc.getHTML(), link: linkIn.value, assignee: s.assignee, due: s.due, done: s.done }),
  };
  return api;
}

function buildTaskEditor(data, mode, handlers = {}) {
  data = data || {};
  const root = document.createElement('div');
  root.className = 'task-editor paper';
  const hint = mode === 'draft'
    ? `<span><kbd>Enter</kbd> next item</span><span><kbd>${ALT}+Enter</kbd> line break</span><span><code>@name</code> assign</span><span><code>!fri</code> due date</span><span><kbd>${MOD}+Enter</kbd> add to board</span>`
    : `<span><kbd>Enter</kbd> next item</span><span><code>@name</code> assign</span><span><code>!fri</code> due date</span><span><kbd>${MOD}+Enter</kbd> save</span><span><kbd>Esc</kbd> close</span>`;
  root.innerHTML = `
    <input class="pe-title" maxlength="200" placeholder="Task title" aria-label="Task title">
    <div class="pe-sub"></div>
    <div class="pe-meta"><select class="pe-cat" aria-label="Category">${CATEGORIES.map(c => `<option value="${esc(c.id)}">${esc(c.id)}</option>`).join('')}</select></div>
    <div class="pe-lines"></div>
    <div class="line-ghost" role="button" tabindex="0">Add an item</div>
    <div class="pe-hint">${hint}</div>`;
  const titleIn = root.querySelector('.pe-title');
  titleIn.value = data.title || '';
  const sub = buildRich(data.subtitle, 'Add a sub-title');
  root.querySelector('.pe-sub').appendChild(sub.el);
  const catSel = root.querySelector('.pe-cat');
  const setCat = v => { catSel.value = CATEGORIES.some(c => c.id === v) ? v : 'None'; catSel.className = 'pe-cat ' + catCls(catSel.value); };
  setCat(data.category);
  catSel.addEventListener('change', () => setCat(catSel.value));

  const box = root.querySelector('.pe-lines');
  const ghost = root.querySelector('.line-ghost');
  const map = new Map();
  const lines = () => [...box.children].map(el => map.get(el)).filter(Boolean);
  const changed = () => root.dispatchEvent(new Event('input', { bubbles: true }));
  const ctx = {
    dragging: null, changed,
    updateGhost() { const ls = lines(); const last = ls[ls.length - 1]; ghost.hidden = !!last && last.isBlank(); },
    newAfter(api) {
      const n = make({});
      if (api) api.el.after(n.el); else box.appendChild(n.el);
      n.fit(); n.ta.focus(); ctx.updateGhost(); changed();
    },
    remove(api, focusPrev) {
      const ls = lines(), i = ls.indexOf(api);
      if (focusPrev && ls.length <= 1) return;
      api.el.remove(); map.delete(api.el);
      if (focusPrev) { const prev = ls[i - 1]; prev ? prev.focusEnd() : titleIn.focus(); }
      ctx.updateGhost(); changed();
    },
    nav(api, dir) {
      const ls = lines(), t = ls[ls.indexOf(api) + dir];
      if (t) t.focusEnd(); else if (dir < 0) titleIn.focus();
    },
  };
  const make = it => { const api = buildLine(it, mode, ctx); map.set(api.el, api); return api; };
  (data.items && data.items.length ? data.items : [{}]).forEach(it => box.appendChild(make(it).el));
  ctx.updateGhost();

  const toFirstLine = () => { const f = lines()[0]; f ? f.focusEnd() : ctx.newAfter(null); };
  titleIn.addEventListener('keydown', e => {
    if ((e.key === 'Enter' && !e.ctrlKey && !e.metaKey) || e.key === 'ArrowDown') { e.preventDefault(); toFirstLine(); }
  });
  const addAtEnd = () => { const ls = lines(); ctx.newAfter(ls[ls.length - 1] || null); };
  ghost.addEventListener('click', addAtEnd);
  ghost.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); addAtEnd(); } });

  box.addEventListener('dragover', e => {
    const drag = ctx.dragging;
    if (!drag || drag.parentNode !== box) return;
    e.preventDefault();
    const after = [...box.children].find(c => c !== drag && e.clientY < c.getBoundingClientRect().top + c.offsetHeight / 2);
    if (after) { if (drag.nextSibling !== after) box.insertBefore(drag, after); }
    else if (box.lastElementChild !== drag) box.appendChild(drag);
  });
  box.addEventListener('drop', e => e.preventDefault());

  root.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); handlers.onSubmit && handlers.onSubmit(); }
    else if (e.key === 'Escape') { handlers.onEscape && handlers.onEscape(); }
  });

  return {
    el: root, titleIn, lines,
    fit: () => lines().forEach(l => l.fit()),
    applyShortcuts: () => lines().forEach(l => l.applyShortcuts()),
    getData: () => ({ title: titleIn.value, subtitle: sub.getHTML(), category: catSel.value, items: lines().map(l => l.getData()) }),
  };
}

// Validates an editor's contents and returns a clean task, or an error message.
function normaliseFromEditor(api) {
  api.applyShortcuts();
  api.el.querySelectorAll('.invalid').forEach(x => x.classList.remove('invalid'));
  const d = api.getData(), ls = api.lines();
  const title = d.title.trim();
  let error = null;
  if (!title) { api.titleIn.classList.add('invalid'); error = 'Add a title for the task.'; }
  const items = [];
  d.items.forEach((it, i) => {
    const t = it.title.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    const hasOther = textOf(it.description) || it.link.trim() || it.assignee || it.due;
    if (!t && !hasOther) return; // blank line: ignore
    if (!t) { ls[i].el.classList.add('invalid'); error = error || 'Each checklist item needs a title.'; return; }
    items.push({ ...it, title: t, link: normLink(it.link) });
  });
  if (error) return { error };
  if (!items.length) items.push({ id: uid(), title: 'Clarify steps', description: '', link: null, assignee: null, due: null, done: false });
  return { task: { title, subtitle: d.subtitle, category: d.category, items } };
}

/* ---------- Data ---------- */
async function loadTasks() {
  const { data, error } = await sb.from('tasks').select('*').order('created_at', { ascending: true });
  if (error) { console.error(error); toast('Couldn’t load your tasks. Refresh the page to try again.', true); return false; }
  state.tasks = data.map(t => ({ ...t, items: Array.isArray(t.items) ? t.items : [] }));
  return true;
}
async function loadDraft() {
  const { data, error } = await sb.from('task_drafts').select('data').eq('user_id', state.user.id).maybeSingle();
  if (error) { console.error(error); return null; }
  return data ? data.data : null;
}

/* ---------- Draft (left column) ---------- */
function setDraftStatus(s) { $('#draft-status').textContent = s; }
function mountDraft(data) {
  const api = buildTaskEditor(data, 'draft', {
    onSubmit: addTask,
    onEscape: () => document.activeElement && document.activeElement.blur(),
  });
  const box = $('#new-form');
  box.innerHTML = '';
  box.appendChild(api.el);
  state.draftEditor = api;
  requestAnimationFrame(api.fit);
  api.el.addEventListener('input', scheduleDraftSave);
  api.el.addEventListener('change', scheduleDraftSave);
}
function scheduleDraftSave() {
  setDraftStatus('Editing…');
  clearTimeout(state.draftTimer);
  state.draftTimer = setTimeout(saveDraft, 700);
}
function saveDraft() {
  clearTimeout(state.draftTimer);
  state.draftTimer = null;
  if (!state.draftEditor || !state.user) return Promise.resolve();
  const data = state.draftEditor.getData();
  setDraftStatus('Saving draft…');
  state.draftChain = state.draftChain.then(async () => {
    const { error } = await sb.from('task_drafts').upsert({ user_id: state.user.id, data, updated_at: new Date().toISOString() });
    if (error) { console.error(error); setDraftStatus('Draft not saved'); }
    else if (!state.draftTimer) setDraftStatus('Draft saved');
  });
  return state.draftChain;
}
function draftHasContent() {
  const d = state.draftEditor.getData();
  return !!(d.title.trim() || textOf(d.subtitle) || d.items.some(i => i.title.trim() || textOf(i.description) || i.link.trim() || i.assignee || i.due));
}
async function clearDraft() {
  if (draftHasContent() && !confirm('Clear this draft?')) return;
  mountDraft(null);
  await saveDraft();
  setDraftStatus('');
}
async function addTask() {
  const res = normaliseFromEditor(state.draftEditor);
  if (res.error) { toast(res.error, true); return; }
  const task = res.task;
  task.completed_at = taskStatus(task) === 'completed' ? new Date().toISOString() : null;
  const btn = $('#add-task-btn');
  btn.disabled = true;
  const { data, error } = await sb.from('tasks').insert(task).select().single();
  btn.disabled = false;
  if (error) { console.error(error); toast('Couldn’t add the task. Check your connection and try again.', true); return; }
  state.tasks.push({ ...data, items: data.items || [] });
  mountDraft(null);
  await saveDraft();
  setDraftStatus('');
  renderAll();
  state.draftEditor.titleIn.focus();
  toast('Task added to board');
}

/* ---------- Editing (right column) ---------- */
function openEditor(id) {
  if (state.editor && state.editor.taskId === id) return true;
  if (state.editor && state.editor.dirty && !confirm('Discard your unsaved changes to the open task?')) return false;
  const t = findTask(id);
  if (!t) return false;
  const api = buildTaskEditor(t, 'edit', { onSubmit: () => saveEdit() });
  const card = document.createElement('article');
  card.className = `task-card expanded ${catCls(t.category)}`;
  card.dataset.id = id;
  card.innerHTML = `<div class="tc-edit-head"><span class="field-label">Edit task</span><button type="button" class="icon-btn ed-close" aria-label="Close without saving" title="Close">${ICONS.x}</button></div>`;
  card.appendChild(api.el);
  const foot = document.createElement('div');
  foot.className = 'tc-edit-foot';
  foot.innerHTML = `<button type="button" class="btn ghost danger ed-delete">Delete task</button><span class="spacer"></span>
    <button type="button" class="btn ed-cancel">Cancel</button><button type="button" class="btn primary ed-save">Save changes</button>`;
  card.appendChild(foot);

  const ed = { taskId: id, card, api, dirty: false };
  const markDirty = () => { ed.dirty = true; };
  api.el.addEventListener('input', markDirty);
  api.el.addEventListener('change', markDirty);
  api.el.querySelector('.pe-cat').addEventListener('change', e => {
    card.className = card.className.replace(/\bcat-[a-z]+\b/, catCls(e.target.value));
  });
  card.querySelector('.ed-close').addEventListener('click', () => closeEditor());
  foot.querySelector('.ed-cancel').addEventListener('click', () => closeEditor());
  foot.querySelector('.ed-save').addEventListener('click', saveEdit);
  foot.querySelector('.ed-delete').addEventListener('click', () => deleteTask(id));
  state.editor = ed;
  return true;
}
function closeEditor(force) {
  if (!state.editor) return;
  if (!force && state.editor.dirty && !confirm('Discard your unsaved changes?')) return;
  state.editor = null;
  state.selectedId = null;
  renderAll();
}
async function saveEdit() {
  const ed = state.editor;
  if (!ed) return;
  const res = normaliseFromEditor(ed.api);
  if (res.error) { toast(res.error, true); return; }
  const t = findTask(ed.taskId);
  const upd = res.task;
  upd.completed_at = taskStatus(upd) === 'completed' ? (t.completed_at || new Date().toISOString()) : null;
  const btn = ed.card.querySelector('.ed-save');
  btn.disabled = true;
  const { data, error } = await sb.from('tasks').update(upd).eq('id', t.id).select().single();
  btn.disabled = false;
  if (error) { console.error(error); toast('Couldn’t save your changes. Try again.', true); return; }
  Object.assign(t, data, { items: data.items || [] });
  state.editor = null;
  state.selectedId = null;
  const st = taskStatus(t);
  renderAll();
  toast(st !== state.tab ? `Changes saved. Task moved to ${TAB_LABEL[st]}.` : 'Changes saved');
}
async function deleteTask(id) {
  const t = findTask(id);
  if (!t || !confirm(`Delete “${t.title}”? This can’t be undone.`)) return;
  const { error } = await sb.from('tasks').delete().eq('id', id);
  if (error) { console.error(error); toast('Couldn’t delete the task. Try again.', true); return; }
  state.tasks = state.tasks.filter(x => x.id !== id);
  state.editor = null;
  state.selectedId = null;
  renderAll();
  toast('Task deleted');
}
async function toggleItem(taskId, itemId, done) {
  const t = findTask(taskId);
  const it = t && t.items.find(i => i.id === itemId);
  if (!it) return;
  const before = { items: JSON.parse(JSON.stringify(t.items)), completed_at: t.completed_at };
  const prev = taskStatus(t);
  it.done = done;
  const st = taskStatus(t);
  t.completed_at = st === 'completed' ? (t.completed_at || new Date().toISOString()) : null;
  renderAll();
  if (st !== prev) toast(st === 'completed' ? 'Task complete. Moved to Completed.' : `Task moved to ${TAB_LABEL[st]}`);
  const { error } = await sb.from('tasks').update({ items: t.items, completed_at: t.completed_at }).eq('id', t.id);
  if (error) { console.error(error); Object.assign(t, before); renderAll(); toast('Couldn’t save that change. Try again.', true); }
}

// Highlight a task, open it on the right (switching tab / filter if needed) and scroll to it.
function selectTask(id) {
  const t = findTask(id);
  if (!t || !openEditor(id)) return;
  state.selectedId = id;
  state.tab = taskStatus(t);
  state.filter.add(t.category);
  renderAll();
  requestAnimationFrame(() => {
    if (state.editor) state.editor.api.fit();
    const card = document.querySelector(`#task-list .task-card[data-id="${CSS.escape(id)}"]`);
    if (!card) return;
    card.scrollIntoView({ block: 'nearest', behavior: reducedMotion() ? 'auto' : 'smooth' });
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
  });
}

/* ---------- Rendering ---------- */
function renderAll() { renderWeek(); renderRight(); updateAssigneeList(); }

function renderWeek() {
  const overdue = state.tasks.reduce((n, t) => n + t.items.filter(itemOverdue).length, 0);
  const strip = $('#overdue-strip');
  strip.classList.toggle('none', !overdue);
  strip.disabled = !overdue;
  strip.innerHTML = overdue
    ? `<span>${overdue} overdue item${overdue === 1 ? '' : 's'}</span><span class="strip-go">Show</span>`
    : '<span>Nothing overdue</span>';

  const base = parseYmd(state.today);
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(base, i), ds = ymd(d);
    const entries = state.tasks
      .map(t => ({ t, due: t.items.filter(it => it.due === ds) }))
      .filter(e => e.due.length)
      .map(e => ({ ...e, allDone: e.due.every(x => x.done) }))
      .sort((a, b) => (a.allDone - b.allDone) || String(a.t.created_at).localeCompare(String(b.t.created_at)));
    const badge = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : '';
    html += `<section class="day ${i === 0 ? 'today' : ''}">
      <header class="day-head">
        <div class="day-name">${WD_LONG[d.getDay()]}${badge ? `<span class="day-badge">${badge}</span>` : ''}</div>
        <div class="day-date">${ordinal(d.getDate())} of ${MON_LONG[d.getMonth()]}</div>
      </header>
      <div class="day-body">${entries.length ? entries.map(weekCardHTML).join('') : '<div class="day-empty">No items due on this day</div>'}</div>
    </section>`;
  }
  $('#week-days').innerHTML = html;
}
function weekCardHTML(e) {
  const shown = e.due.slice(0, 2), more = e.due.length - shown.length;
  return `<button type="button" class="wk-card ${catCls(e.t.category)} ${e.allDone ? 'all-done' : ''} ${state.selectedId === e.t.id ? 'selected' : ''}" data-id="${esc(e.t.id)}">
    <span class="wk-title">${esc(e.t.title)}</span>
    ${shown.map(it => `<span class="wk-item ${it.done ? 'done' : ''}">${esc(truncate(it.title.replace(/\s*\n\s*/g, ' '), PREVIEW_CHARS))}</span>`).join('')}
    ${more > 0 ? `<span class="wk-more">+${more} more</span>` : ''}
  </button>`;
}

function sortTasks(list, tab) {
  if (tab === 'completed') return list.sort((a, b) => String(b.completed_at || '').localeCompare(String(a.completed_at || '')));
  return list.sort((a, b) => {
    const da = nextDue(a), db = nextDue(b);
    if (da && db && da !== db) return da < db ? -1 : 1;
    if (da && !db) return -1;
    if (!da && db) return 1;
    return String(a.created_at).localeCompare(String(b.created_at));
  });
}
function renderRight() {
  const visible = state.tasks.filter(t => state.filter.has(t.category));
  const counts = { current: 0, overdue: 0, completed: 0 };
  visible.forEach(t => counts[taskStatus(t)]++);
  document.querySelectorAll('#tabs .tab').forEach(b => {
    const tab = b.dataset.tab;
    b.classList.toggle('active', tab === state.tab);
    b.setAttribute('aria-selected', tab === state.tab);
    const c = b.querySelector('.tab-count');
    c.textContent = counts[tab];
    c.classList.toggle('has', counts[tab] > 0);
  });

  $('#filters').innerHTML = '<span class="field-label">Show</span>' + CATEGORIES.map(c =>
    `<button type="button" class="chip-toggle ${c.cls} ${state.filter.has(c.id) ? 'on' : ''}" data-cat="${esc(c.id)}" aria-pressed="${state.filter.has(c.id)}"><span class="dot"></span>${esc(c.id)}</button>`).join('');

  const list = $('#task-list');
  const tasks = sortTasks(visible.filter(t => taskStatus(t) === state.tab), state.tab);
  list.innerHTML = '';
  if (!tasks.length) {
    const msg = !state.filter.size ? 'Choose at least one category above to see tasks.'
      : { current: 'No current tasks. Add one from the New task panel.', overdue: 'Nothing overdue.', completed: 'Completed tasks will appear here.' }[state.tab];
    list.innerHTML = `<div class="list-empty">${msg}</div>`;
    return;
  }
  tasks.forEach(t => {
    if (state.editor && state.editor.taskId === t.id) {
      state.editor.card.classList.toggle('selected', state.selectedId === t.id);
      list.appendChild(state.editor.card);
    } else {
      list.insertAdjacentHTML('beforeend', taskCardHTML(t));
    }
  });
}
function itemRowHTML(it) {
  const dueCls = !it.due ? '' : itemOverdue(it) ? 'due-over' : (it.due === state.today && !it.done ? 'due-today' : '');
  const href = safeHref(it.link);
  return `<li class="tc-item ${it.done ? 'done' : ''}" data-item="${esc(it.id)}">
    <input type="checkbox" class="check tc-check" ${it.done ? 'checked' : ''} aria-label="Mark ${esc(it.title)} as done">
    <span class="tc-item-title">${esc(it.title)}</span>
    ${href ? `<a class="tc-link" href="${esc(href)}" target="_blank" rel="noopener noreferrer" title="${esc(href)}">Link</a>` : ''}
    ${it.assignee ? `<span class="pill" title="${esc(it.assignee)}">${esc(it.assignee)}</span>` : ''}
    ${it.due ? `<span class="pill ${dueCls}">${esc(formatDue(it.due))}</span>` : ''}
  </li>`;
}
const collapsedHTML = n => `<li class="tc-collapsed">${ICONS.done}+${n} items complete</li>`;
function taskCardHTML(t) {
  const items = t.items, n = items.length;
  const done = items.filter(i => i.done).length;
  const allDone = n > 0 && done === n;
  // Runs of 2+ ticked items at the very start or end collapse (unless every item is ticked)
  let lead = 0; while (lead < n && items[lead].done) lead++;
  let trail = 0; while (trail < n - lead && items[n - 1 - trail].done) trail++;
  const cLead = !allDone && lead >= 2, cTrail = !allDone && trail >= 2;
  let rows = '';
  if (cLead) rows += collapsedHTML(lead) + '<li class="tc-divider" aria-hidden="true"></li>';
  items.slice(cLead ? lead : 0, cTrail ? n - trail : n).forEach(it => { rows += itemRowHTML(it); });
  if (cTrail) rows += '<li class="tc-divider" aria-hidden="true"></li>' + collapsedHTML(trail);
  return `<article class="task-card ${catCls(t.category)} ${state.selectedId === t.id ? 'selected' : ''}" data-id="${esc(t.id)}" tabindex="0">
    <div class="tc-head">
      <div class="tc-head-text">
        <div class="tc-title">${esc(t.title)}</div>
        ${textOf(t.subtitle) ? `<div class="tc-sub fmt">${sanitizeHTML(t.subtitle)}</div>` : ''}
      </div>
      <div class="tc-meta">${t.category !== 'None' ? `<span class="cat-tag">${esc(t.category)}</span>` : ''}<span class="tc-progress">${done}/${n}</span></div>
    </div>
    <ul class="tc-items">${rows}</ul>
  </article>`;
}
function updateAssigneeList() {
  const names = new Set();
  state.tasks.forEach(t => t.items.forEach(i => { if (i.assignee && i.assignee !== 'Me') names.add(i.assignee); }));
  $('#assignee-list').innerHTML = [...names].sort((a, b) => a.localeCompare(b)).map(n => `<option value="${esc(n)}">`).join('');
}

/* ---------- Events ---------- */
function wireEvents() {
  $('#add-task-btn').addEventListener('click', addTask);
  $('#clear-draft').addEventListener('click', clearDraft);
  $('#overdue-strip').addEventListener('click', () => { state.tab = 'overdue'; renderRight(); });
  $('#week-days').addEventListener('click', e => {
    const card = e.target.closest('.wk-card');
    if (card) selectTask(card.dataset.id);
  });
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if (b) { state.tab = b.dataset.tab; renderRight(); }
  });
  $('#filters').addEventListener('click', e => {
    const b = e.target.closest('.chip-toggle');
    if (!b) return;
    const c = b.dataset.cat;
    state.filter.has(c) ? state.filter.delete(c) : state.filter.add(c);
    renderRight();
  });
  const list = $('#task-list');
  list.addEventListener('change', e => {
    if (!e.target.classList.contains('tc-check')) return;
    const card = e.target.closest('.task-card'), li = e.target.closest('.tc-item');
    toggleItem(card.dataset.id, li.dataset.item, e.target.checked);
  });
  list.addEventListener('click', e => {
    if (e.target.closest('.tc-check, .tc-link')) return;
    const card = e.target.closest('.task-card:not(.expanded)');
    if (card) selectTask(card.dataset.id);
  });
  list.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || !e.target.matches('.task-card:not(.expanded)')) return;
    e.preventDefault();
    selectTask(e.target.dataset.id);
  });
  $('#signout-btn').addEventListener('click', async () => {
    if (state.editor && state.editor.dirty && !confirm('Discard your unsaved changes and sign out?')) return;
    if (state.draftTimer) await saveDraft();
    await state.draftChain;
    await sb.auth.signOut();
  });
  document.addEventListener('visibilitychange', async () => {
    if (!state.started) return;
    if (document.visibilityState === 'hidden') { if (state.draftTimer) saveDraft(); return; }
    checkDay();
    if (state.editor) return; // don't disturb an open edit
    if (await loadTasks()) renderAll();
  });
  // Esc closes the open task on the right (unless you're typing in the New task panel)
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || !state.editor) return;
    if (state.draftEditor && state.draftEditor.el.contains(e.target)) return;
    closeEditor();
  });
  window.addEventListener('resize', () => {
    if (state.draftEditor) state.draftEditor.fit();
    if (state.editor) state.editor.api.fit();
  });
  window.addEventListener('beforeunload', e => {
    if (state.draftTimer) saveDraft();
    if (state.editor && state.editor.dirty) { e.preventDefault(); e.returnValue = ''; }
  });
}
function checkDay() {
  const t = todayStr();
  if (t !== state.today) { state.today = t; renderAll(); }
}

/* ---------- Top bar toggles (saved in this browser) ---------- */
const effectiveTheme = () => document.documentElement.dataset.theme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function updateTopbarToggles() {
  const on = document.documentElement.dataset.gradient === 'on';
  const g = $('#gradient-btn'), t = $('#theme-btn');
  g.innerHTML = ICONS.sparkle;
  g.setAttribute('aria-pressed', on);
  g.title = on ? 'Turn gradient off' : 'Turn gradient on';
  const dark = effectiveTheme() === 'dark';
  t.innerHTML = dark ? ICONS.sun : ICONS.moon;
  t.title = dark ? 'Switch to light mode' : 'Switch to dark mode';
}
function wireTopbarToggles() {
  const root = document.documentElement;
  const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  $('#gradient-btn').addEventListener('click', () => {
    const next = root.dataset.gradient === 'on' ? 'off' : 'on';
    root.dataset.gradient = next; save('todo-gradient', next); updateTopbarToggles();
  });
  $('#theme-btn').addEventListener('click', () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next; save('todo-theme', next); updateTopbarToggles();
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTopbarToggles);
  updateTopbarToggles();
}

/* ---------- Screens & auth ---------- */
function show(which) {
  $('#config-screen').hidden = which !== 'config';
  $('#login-screen').hidden = which !== 'login';
  $('#main').hidden = which !== 'main';
}
async function start(user) {
  if (state.started) return;
  state.started = true;
  state.user = user;
  state.today = todayStr();
  $('#user-email').textContent = user.email || '';
  show('main');
  $('#week-days').innerHTML = $('#task-list').innerHTML = '<div class="loading">Loading your tasks…</div>';
  const [, draft] = await Promise.all([loadTasks(), loadDraft()]);
  mountDraft(draft);
  renderAll();
}
function resetState() {
  Object.assign(state, { user: null, started: false, tasks: [], tab: 'current', selectedId: null, editor: null, draftEditor: null });
  state.filter = new Set(CATEGORIES.map(c => c.id));
  clearTimeout(state.draftTimer); state.draftTimer = null;
  $('#new-form').innerHTML = ''; setDraftStatus('');
}
async function init() {
  wireTopbarToggles();
  if (!SUPABASE_URL || !SUPABASE_KEY || SUPABASE_URL.includes('YOUR-') || SUPABASE_KEY.includes('YOUR-')) { show('config'); return; }
  if (!window.supabase) {
    $('#config-msg').textContent = 'The Supabase library didn’t load. Check your internet connection and refresh the page.';
    show('config'); return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  wireEvents();
  setInterval(() => { if (state.started) checkDay(); }, 60000);

  $('#login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#login-error'), btn = $('#login-btn');
    err.hidden = true; btn.disabled = true; btn.textContent = 'Signing in…';
    const { data, error } = await sb.auth.signInWithPassword({ email: $('#login-email').value.trim(), password: $('#login-password').value });
    btn.disabled = false; btn.textContent = 'Sign in';
    if (error) { err.textContent = error.message === 'Invalid login credentials' ? 'That email and password don’t match. Try again.' : error.message; err.hidden = false; return; }
    $('#login-password').value = '';
    start(data.user);
  });
  sb.auth.onAuthStateChange((event) => {
    if (event === 'SIGNED_OUT') { resetState(); show('login'); }
  });

  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session.user); else show('login');
}
init();
</script>
